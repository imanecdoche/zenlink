[package]
name = "zenlink-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ZenLink"
path = "src/main.rs"

[dependencies]
zenlink-core = { path = "../zenlink-core" }
zenlink-video = { path = "../zenlink-video" }
zenlink-android = { path = "../zenlink-android" }
zenlink-audio = { path = "../zenlink-audio" }
serde_json = { workspace = true }
miniz_oxide = { version = "0.9", optional = true }
log = { workspace = true }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-winit-030", "raw-window-handle-06"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory"] }

[build-dependencies]
slint-build = "1.18"
# Packs adb for Portable.exe (already in the tree through Slint's png).
miniz_oxide = "0.9"

[features]
# Portable.exe: the Python backend (ZENLINK_BACKEND_EXE) and Google's adb
# (ZENLINK_ADB_DIR) packed into ZenLink.exe.
embedded-backend = ["zenlink-core/embedded-backend", "dep:miniz_oxide"]
