[workspace]
resolver = "2"
members = ["crates/zenlink-core", "crates/zenlink-video", "crates/zenlink-app", "crates/zenlink-android"]

[workspace.package]
version = "2.5.0-beta.1"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Zenvy Zenshiro"]

[workspace.dependencies]
windows = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["json"] }
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
